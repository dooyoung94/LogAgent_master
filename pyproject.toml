[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "logagent-benchmark"
version = "0.1.0"
description = "Leakage-controlled relation-recovery benchmarks for LogAgent"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
]

[project.optional-dependencies]
deberta = [
  "onnxruntime>=1.20,<2",
  "transformers>=4.46,<5",
  "sentencepiece>=0.2,<1",
  "huggingface-hub>=0.26,<1",
]
deberta-torch = ["transformers>=4.44", "torch>=2.2"]
psl = ["pslpython==2.4.0"]
test = ["pytest>=8"]

[project.scripts]
logagent-rcaeval-smoke = "logagent_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
