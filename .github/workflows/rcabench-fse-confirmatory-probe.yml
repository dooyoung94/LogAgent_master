name: RCABench FSE Confirmatory Probe

on:
  pull_request:
    branches:
      - research/reference-matrix-readiness
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/rcabench-fse-confirmatory-probe.yml"
      - "runs/rcabench_fse_probe_request.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface-hub>=0.26,<1" "pyarrow>=15" "pandas>=2.2"

      - name: Probe checksum-locked official dataset revision
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          import pandas as pd
          import pyarrow.parquet as pq
          from huggingface_hub import HfApi, hf_hub_download

          REPO_ID = "HamsterStation/rcabench-fse"
          REVISION = "v1.0.0"
          EXPECTED_TEST_CASES = 296
          EXPECTED_ALL_MANIFEST_SHA256 = "588165081264b3de851b7b3b7ec59d27a5258107ad04c56d8c1c3f2a5ff76da7"

          output = Path("outputs/rcabench_fse_probe")
          output.mkdir(parents=True, exist_ok=True)
          snapshot = output / "snapshot"
          snapshot.mkdir()

          manifest_paths = {}
          for split in ("all", "train", "test"):
              filename = f"manifests/{split}.txt"
              local = Path(
                  hf_hub_download(
                      repo_id=REPO_ID,
                      repo_type="dataset",
                      revision=REVISION,
                      filename=filename,
                      local_dir=snapshot,
                  )
              )
              manifest_paths[split] = local

          all_digest = hashlib.sha256(manifest_paths["all"].read_bytes()).hexdigest()
          if all_digest != EXPECTED_ALL_MANIFEST_SHA256:
              raise SystemExit(
                  f"all manifest SHA mismatch: {all_digest} != {EXPECTED_ALL_MANIFEST_SHA256}"
              )

          manifests = {
              split: [
                  line.strip()
                  for line in path.read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]
              for split, path in manifest_paths.items()
          }
          if len(manifests["test"]) != EXPECTED_TEST_CASES:
              raise SystemExit(
                  f"unexpected test case count: {len(manifests['test'])}"
              )
          if set(manifests["train"]) & set(manifests["test"]):
              raise SystemExit("official train/test manifests overlap")
          if set(manifests["train"]) | set(manifests["test"]) != set(manifests["all"]):
              raise SystemExit("official train/test manifests do not partition all")

          files = HfApi().list_repo_files(
              repo_id=REPO_ID,
              repo_type="dataset",
              revision=REVISION,
          )
          test_entries = sorted(manifests["test"])
          # Selection uses only the frozen case identifier and revision, before
          # reading telemetry, labels, fault type, or model performance.
          selected_entry = min(
              test_entries,
              key=lambda item: hashlib.sha256(
                  f"{REVISION}|confirmatory-probe|{item}".encode("utf-8")
              ).hexdigest(),
          )
          normalized = selected_entry.strip("/")
          prefixes = [normalized]
          if not normalized.startswith("data/"):
              prefixes.append(f"data/{normalized}")
          case_files = sorted(
              filename
              for filename in files
              if any(
                  filename == prefix or filename.startswith(prefix + "/")
                  for prefix in prefixes
              )
          )
          if not case_files:
              # Manifest entries in some native datasets point to a metadata
              # file.  Resolve the containing directory without guessing labels.
              parent = normalized.rsplit("/", 1)[0] if "/" in normalized else normalized
              case_files = sorted(
                  filename
                  for filename in files
                  if filename.startswith(parent + "/")
                  or filename.startswith("data/" + parent + "/")
              )
          if not case_files:
              raise SystemExit(
                  f"unable to resolve selected test entry in repository tree: {selected_entry}"
              )

          desired_names = {
              "normal_traces.parquet",
              "abnormal_traces.parquet",
              "injection.json",
              "causal_graph.json",
              "conclusion.parquet",
              "env.json",
          }
          desired = [
              path for path in case_files if Path(path).name in desired_names
          ]
          if not {
              "normal_traces.parquet",
              "abnormal_traces.parquet",
          }.issubset({Path(path).name for path in desired}):
              raise SystemExit(
                  "selected test incident does not expose both normal and abnormal trace files"
              )

          downloaded = {}
          schema = {}
          for filename in desired:
              local = Path(
                  hf_hub_download(
                      repo_id=REPO_ID,
                      repo_type="dataset",
                      revision=REVISION,
                      filename=filename,
                      local_dir=snapshot,
                  )
              )
              downloaded[filename] = {
                  "bytes": local.stat().st_size,
                  "sha256": hashlib.sha256(local.read_bytes()).hexdigest(),
              }
              if local.suffix == ".parquet":
                  parquet = pq.ParquetFile(local)
                  schema[filename] = {
                      "rows": parquet.metadata.num_rows,
                      "row_groups": parquet.metadata.num_row_groups,
                      "columns": [field.name for field in parquet.schema_arrow],
                  }

          required_trace_semantics = {
              "trace_id": {"trace_id", "traceID"},
              "span_id": {"span_id", "spanID"},
              "parent_span_id": {"parent_span_id", "parentSpanID"},
              "service": {"service_name", "serviceName", "service_id"},
          }
          trace_audit = {}
          for filename, item in schema.items():
              if not filename.endswith("traces.parquet"):
                  continue
              columns = set(item["columns"])
              missing = [
                  semantic
                  for semantic, aliases in required_trace_semantics.items()
                  if not aliases.intersection(columns)
              ]
              trace_audit[filename] = {
                  "missing_required_semantics": missing,
                  "ready": not missing,
              }
          if not trace_audit or not all(item["ready"] for item in trace_audit.values()):
              raise SystemExit(f"trace schema is not adapter-ready: {trace_audit}")

          result = {
              "schema_version": 1,
              "status": "READY",
              "dataset": {
                  "repo_id": REPO_ID,
                  "revision": REVISION,
                  "all_manifest_sha256": all_digest,
                  "manifest_counts": {
                      split: len(values) for split, values in manifests.items()
                  },
              },
              "selection_contract": {
                  "split": "official_test",
                  "selected_before_telemetry_inspection": True,
                  "selection_material": "revision + opaque manifest entry",
                  "selected_entry": selected_entry,
              },
              "repository_file_count": len(files),
              "selected_case_files": case_files,
              "downloaded": downloaded,
              "schemas": schema,
              "trace_schema_audit": trace_audit,
          }
          (output / "probe.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (output / "test_manifest.txt").write_text(
              "\n".join(manifests["test"]) + "\n", encoding="utf-8"
          )
          (output / "repo_files.txt").write_text(
              "\n".join(files) + "\n", encoding="utf-8"
          )
          print("RCABENCH_FSE_PROBE_START")
          print(json.dumps(result, indent=2, ensure_ascii=False, sort_keys=True))
          print("RCABENCH_FSE_PROBE_END")
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: rcabench-fse-confirmatory-probe-${{ github.sha }}
          path: outputs/rcabench_fse_probe
          if-no-files-found: error
          retention-days: 30
