name: Task A Phase 4 Direct-evidence PSL v2

on:
  push:
    branches:
      - research/task-a-phase4-psl-v2-abstention
    paths:
      - ".github/workflows/task-a-phase4-psl-v2.yml"
      - "configs/experiment_task_a_rcaeval_phase4_psl_v2.json"
      - "src/logagent_benchmark/psl_direct_evidence_v2.py"
      - "src/logagent_benchmark/task_a_phase4_psl_v2.py"
      - "tools/run_task_a_phase4_psl_v2.py"
      - "tests/test_task_a_phase4_psl_v2.py"
      - "docs/task_a_phase4_psl_v2.md"
  pull_request:
    branches:
      - research/reference-matrix-readiness
    paths:
      - ".github/workflows/task-a-phase4-psl-v2.yml"
      - "configs/experiment_task_a_rcaeval_phase4_psl_v2.json"
      - "src/logagent_benchmark/psl_direct_evidence_v2.py"
      - "src/logagent_benchmark/task_a_phase4_psl_v2.py"
      - "tools/run_task_a_phase4_psl_v2.py"
      - "tests/test_task_a_phase4_psl_v2.py"
      - "docs/task_a_phase4_psl_v2.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: task-a-phase4-psl-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-evidence-abstention:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install tests, data stack and official PSL runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pandas>=2.2" "pyarrow>=15" "pytest>=8"
          python -m pip install "pslpython==2.4.0"

      - name: Run repository tests including real PSL v2 integration
        run: python -m pytest -q

      - name: Download checksum-locked A2 candidate handoff
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: "9874215580"
          SOURCE_ARTIFACT_SHA256: "4a1ea87b11a931cc31001bd71e25aa4bcc79695c4c9bb396d0137d75c97e2613"
        run: |
          mkdir -p inputs/r2
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output inputs/task-a-phase3-r2-source.zip
          echo "${SOURCE_ARTIFACT_SHA256}  inputs/task-a-phase3-r2-source.zip" | sha256sum --check
          unzip -q inputs/task-a-phase3-r2-source.zip -d inputs/r2

      - name: Verify frozen 1,250-candidate source and direct fields
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import pandas as pd

          expected_sha = "b70eae427275fa368c217b82a5e4635765d3526f5b2be13cc062ec979c44ab31"
          paths = list(Path("inputs/r2").rglob("all_candidate_analysis.parquet"))
          if len(paths) != 1:
              raise SystemExit(f"expected one candidate analysis, found {len(paths)}")
          path = paths[0]
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != expected_sha:
              raise SystemExit(f"candidate analysis checksum mismatch: {digest}")
          frame = pd.read_parquet(path)
          required = {
              "incident_token", "seed", "mask_id", "mask_ratio",
              "subject", "predicate", "object",
              "a2_score", "a2_rank_normalized", "proposal_rank",
              "supporting_traces", "boundary_spans",
              "reverse_supporting_traces", "reverse_boundary_spans",
              "direct_evidence", "boundary_alignment", "direction_score",
              "operation_role_score", "operation_pair_concentration",
              "method_coverage", "method_match_rate", "route_coverage",
              "route_exact_rate", "route_jaccard_mean",
              "operation_jaccard_mean", "endpoint_compatibility_score",
              "graph_role_score", "case", "fault", "role",
              "is_masked_target", "is_silver_matched"
          }
          missing = sorted(required - set(frame.columns))
          cells = frame.groupby(["incident_token", "seed", "mask_id"]).ngroups
          if len(frame) != 1250 or cells != 60 or missing:
              raise SystemExit(
                  f"invalid handoff rows={len(frame)} cells={cells} missing={missing}"
              )
          direct_positive = int(
              pd.to_numeric(frame["direct_evidence"], errors="coerce")
              .fillna(0.0)
              .gt(0.0)
              .sum()
          )
          Path("inputs/candidate_analysis_path.txt").write_text(str(path))
          print(
              f"PSL_V2_HANDOFF_READY rows={len(frame)} cells={cells} "
              f"incidents={frame['case'].nunique()} "
              f"legacy_direct_positive={direct_positive} sha256={digest}"
          )
          PY

      - name: Execute direct-evidence PSL v2
        id: experiment
        shell: bash
        run: |
          mkdir -p outputs/task_a
          set +e
          ANALYSIS=$(cat inputs/candidate_analysis_path.txt)
          python tools/run_task_a_phase4_psl_v2.py \
            --candidate-analysis "$ANALYSIS" \
            --config configs/experiment_task_a_rcaeval_phase4_psl_v2.json \
            --output outputs/task_a/phase4_psl_v2 \
            2>&1 | tee outputs/task_a/phase4-psl-v2-execution.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify mechanism output and print compact result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          code = int("${{ steps.experiment.outputs.exit_code || '99' }}")
          if code not in (0, 2, 3):
              raise SystemExit(f"PSL v2 execution crashed: exit={code}")
          path = Path(
              "outputs/task_a/phase4_psl_v2/published/"
              "task_a_phase4_psl_v2_results.json"
          )
          if not path.is_file():
              raise SystemExit("PSL v2 result JSON was not created")
          result = json.loads(path.read_text(encoding="utf-8"))
          if result["source"]["candidate_rows"] != 1250:
              raise SystemExit("PSL v2 did not process all A2 candidates")
          if not result["mechanism_gate"]["passed"]:
              raise SystemExit(
                  "PSL v2 mechanism contract failed: "
                  + ", ".join(result["reason_codes"])
              )
          if result["status"] not in {"PASS", "FAIL", "INELIGIBLE"}:
              raise SystemExit(f"invalid scientific status: {result['status']}")
          held = result["heldout"]
          compact = {
              "status": result["status"],
              "reason_codes": result["reason_codes"],
              "mechanism_gate": result["mechanism_gate"],
              "data_eligibility": result["data_eligibility"],
              "utility_gate": result["utility_gate"],
              "abstention_policy": result["abstention_policy"],
              "heldout": held,
              "evidence_diagnostics": result["evidence_diagnostics"],
              "negative_relation_rule_count": result["psl"]["metadata"][
                  "negative_relation_rule_count"
              ],
              "a2_prior_used_for_confirmation": result["psl"]["metadata"][
                  "uses_a2_prior_for_confirmation"
              ],
              "weak_evidence_invariance": result["weak_evidence_invariance"],
          }
          print("TASK_A_PHASE4_PSL_V2_RESULT_START")
          print(json.dumps(compact, indent=2, ensure_ascii=False, sort_keys=True))
          print("TASK_A_PHASE4_PSL_V2_RESULT_END")
          PY

      - name: Upload complete PSL v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-a-phase4-psl-v2-${{ github.sha }}
          path: |
            outputs/task_a/phase4_psl_v2
            outputs/task_a/phase4-psl-v2-execution.log
          if-no-files-found: error
          retention-days: 30

      - name: Record scientific outcome without hiding INELIGIBLE or FAIL
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  "outputs/task_a/phase4_psl_v2/published/"
                  "task_a_phase4_psl_v2_results.json"
              ).read_text(encoding="utf-8")
          )
          status = result["status"]
          if status != "PASS":
              raise SystemExit(
                  f"D4D_A4_DIRECT_EVIDENCE_ABSTENTION_V2={status}: "
                  + ", ".join(result["reason_codes"])
              )
          print("D4D_A4_DIRECT_EVIDENCE_ABSTENTION_V2: PASS")
          PY
