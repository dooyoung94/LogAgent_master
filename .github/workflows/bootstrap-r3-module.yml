name: Materialize A3-R3 implementation

on:
  push:
    branches:
      - research/task-a-phase3-r3-channel-nli
    paths:
      - ".bootstrap/task_a_phase3_r3.py.gz"
      - ".github/workflows/bootstrap-r3-module.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout R3 branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Materialize and verify implementation
        run: |
          mkdir -p src/logagent_benchmark
          gzip -dc .bootstrap/task_a_phase3_r3.py.gz \
            > src/logagent_benchmark/task_a_phase3_r3.py
          echo "28f80c113f3e04075eb44ecb386bfd2b708c3ec3b39b407d168152fe63c8da7a  src/logagent_benchmark/task_a_phase3_r3.py" \
            | sha256sum --check
          python -m py_compile src/logagent_benchmark/task_a_phase3_r3.py

      - name: Run R3 unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_task_a_phase3_r3.py

      - name: Commit materialized module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/logagent_benchmark/task_a_phase3_r3.py
          if git diff --cached --quiet; then
            echo "A3-R3 module already materialized"
            exit 0
          fi
          git commit -m "feat: add channel-specific DeBERTa evidence reranker"
          git push origin HEAD:research/task-a-phase3-r3-channel-nli
