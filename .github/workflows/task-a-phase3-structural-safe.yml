name: Task A Phase 3 Risk-Limited Structural Evidence

on:
  push:
    branches:
      - research/task-a-phase3-structural-evidence
    paths:
      - ".github/workflows/task-a-phase3-structural-safe.yml"
      - "configs/experiment_task_a_rcaeval_phase3_structural_safe.json"
      - "src/logagent_benchmark/phase3_structural_risk_limited.py"
      - "tools/run_task_a_phase3_structural_safe.py"
      - "tests/test_phase3_structural_risk_limited.py"
  pull_request:
    branches:
      - research/reference-matrix-readiness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-a-phase3-structural-safe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  risk-limited-structural:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install "huggingface-hub>=0.26,<1"

      - name: Run repository tests
        run: python -m pytest -q

      - name: Restore heavy Phase 2 structural source
        id: phase2-cache
        uses: actions/cache/restore@v4
        with:
          path: outputs/task_a/phase2_structural_source
          key: >-
            task-a-phase2-structural-heavy-${{
              hashFiles(
                'configs/experiment_task_a_rcaeval.json',
                'configs/experiment_task_a_rcaeval_phase2.json',
                'src/logagent_benchmark/cli_task_a.py',
                'src/logagent_benchmark/cli_v2.py',
                'src/logagent_benchmark/graph.py',
                'src/logagent_benchmark/masking.py',
                'src/logagent_benchmark/metrics.py',
                'src/logagent_benchmark/rcaeval.py',
                'src/logagent_benchmark/recovery.py',
                'src/logagent_benchmark/task_a.py',
                'src/logagent_benchmark/task_a_phase2.py',
                'tools/run_task_a.py',
                'tools/run_task_a_phase2.py'
              )
            }}

      - name: Prepare source data on cache miss
        if: steps.phase2-cache.outputs.cache-hit != 'true'
        run: |
          python tools/prepare_task_a_phase2_data.py \
            --config configs/experiment_task_a_rcaeval_phase2.json \
            --dest data/raw/rcaeval/phase2

      - name: Reproduce heavy Phase 2 source on cache miss
        if: steps.phase2-cache.outputs.cache-hit != 'true'
        run: |
          python tools/run_task_a_phase2.py \
            --config configs/experiment_task_a_rcaeval_phase2.json \
            --raw-root data/raw/rcaeval/phase2 \
            --output outputs/task_a/phase2_structural_source \
            --max-workers 2 \
            --keep-heavy-artifacts

      - name: Save heavy Phase 2 source on cache miss
        if: steps.phase2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: outputs/task_a/phase2_structural_source
          key: ${{ steps.phase2-cache.outputs.cache-primary-key }}

      - name: Verify Phase 2 structural source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("outputs/task_a/phase2_structural_source")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          cells = pd.read_csv(root / "cells.csv")
          traces = sorted(root.glob("runs/*/seed-*/masks/*/model_input/traces.parquet"))
          a2 = sorted(root.glob("runs/*/seed-*/masks/*/predictions/A2.parquet"))
          if not summary["gate"]["passed"] or len(cells) != 60:
              raise SystemExit("Phase-2 D3 source contract failed")
          if len(traces) != 60 or len(a2) != 60:
              raise SystemExit(
                  f"expected 60 trace/A2 artifacts, got {len(traces)}/{len(a2)}"
              )
          print("RISK_LIMITED_SOURCE_READY cells=60 traces=60 a2=60")
          PY

      - name: Recreate structural candidate evidence source
        id: source
        shell: bash
        run: |
          set +e
          python tools/run_task_a_phase3_structural.py \
            --config configs/experiment_task_a_rcaeval_phase3_structural.json \
            --phase2-root outputs/task_a/phase2_structural_source \
            --output outputs/task_a/phase3_structural_source \
            2>&1 | tee outputs/task_a/phase3-structural-source.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -f outputs/task_a/phase3_structural_source/evaluator_private/a3s_candidate_analysis.parquet

      - name: Run risk-limited structural policy development test
        id: safe
        shell: bash
        run: |
          set +e
          python tools/run_task_a_phase3_structural_safe.py \
            --config configs/experiment_task_a_rcaeval_phase3_structural_safe.json \
            --candidate-analysis outputs/task_a/phase3_structural_source/evaluator_private/a3s_candidate_analysis.parquet \
            --output outputs/task_a/phase3_structural_safe \
            2>&1 | tee outputs/task_a/phase3-structural-safe.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload risk-limited structural artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-a-phase3-structural-safe-${{ github.sha }}
          path: |
            outputs/task_a/phase3_structural_safe
            outputs/task_a/phase3-structural-safe.log
            outputs/task_a/phase3-structural-source.log
            outputs/task_a/phase3_structural_source/published
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce development gate
        if: always()
        run: |
          test "${{ steps.safe.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("outputs/task_a/phase3_structural_safe/summary.json")
              .read_text(encoding="utf-8")
          )
          if not summary["gate"]["passed"]:
              raise SystemExit(
                  "Risk-limited development gate failed: "
                  + ", ".join(summary["gate"]["reason_codes"])
              )
          if not summary["gate"]["confirmation_required"]:
              raise SystemExit("fresh confirmatory holdout must remain required")
          print("D4_A3_RISK_LIMITED_STRUCTURAL_DEVELOPMENT: PASS")
          PY
