name: Task A Phase 3-R1 Publish Results

on:
  push:
    branches:
      - research/task-a-phase3-r1-structured-evidence
    paths:
      - ".github/workflows/task-a-phase3-r1-publish.yml"
      - "configs/experiment_task_a_rcaeval_phase3_r1.json"
      - "src/logagent_benchmark/task_a_phase3_r1.py"
      - "tools/run_task_a_phase3_r1.py"
      - "tests/test_task_a_phase3_r1.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: task-a-phase3-r1-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest -q

      - name: Download and verify frozen source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: "9832926724"
          SOURCE_ARTIFACT_SHA256: "1b5e5fbba01702eee359f729de478b19767d596bd88a3b1023f46385b9bdbab6"
        run: |
          mkdir -p inputs/a3
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output inputs/task-a-phase3-source.zip
          echo "${SOURCE_ARTIFACT_SHA256}  inputs/task-a-phase3-source.zip" | sha256sum --check
          unzip -q inputs/task-a-phase3-source.zip -d inputs/a3
          find inputs/a3 -name a3_candidate_analysis.parquet -print -quit > inputs/candidate_path.txt
          test -s inputs/candidate_path.txt

      - name: Execute A3-R1
        id: experiment
        shell: bash
        run: |
          set +e
          python tools/run_task_a_phase3_r1.py \
            --candidate-analysis "$(cat inputs/candidate_path.txt)" \
            --config configs/experiment_task_a_rcaeval_phase3_r1.json \
            --output outputs/task_a/phase3_r1 \
            2>&1 | tee outputs/task_a/phase3_r1-execution.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish compact result files to branch
        if: always()
        run: |
          test -f outputs/task_a/phase3_r1/published/task_a_phase3_r1_results.json
          cp outputs/task_a/phase3_r1/published/task_a_phase3_r1_results.md reports/
          cp outputs/task_a/phase3_r1/published/task_a_phase3_r1_results.json reports/
          cp outputs/task_a/phase3_r1/published/task_a_phase3_r1_heldout_cells.csv reports/
          cp outputs/task_a/phase3_r1/published/task_a_phase3_r1_calibration_cells.csv reports/
          cp outputs/task_a/phase3_r1/published/task_a_phase3_r1_policy_grid.csv reports/
          cp outputs/task_a/phase3_r1/published/task_a_phase3_r1_status.txt reports/
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          result = Path("reports/task_a_phase3_r1_results.json")
          data = json.loads(result.read_text(encoding="utf-8"))
          manifest = {
              "source_artifact_id": 9832926724,
              "source_artifact_zip_sha256": "1b5e5fbba01702eee359f729de478b19767d596bd88a3b1023f46385b9bdbab6",
              "workflow_run_id": int("${{ github.run_id }}"),
              "tested_commit": "${{ github.sha }}",
              "scientific_gate": data["gate"],
              "files": {}
          }
          for path in sorted(Path("reports").glob("task_a_phase3_r1_*")):
              manifest["files"][path.name] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          Path("reports/task_a_phase3_r1_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/task_a_phase3_r1_*
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            STATUS=$(cat reports/task_a_phase3_r1_status.txt)
            git commit -m "results: record A3-R1 structured evidence ${STATUS}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload full reproducibility artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-a-phase3-r1-${{ github.sha }}
          path: |
            outputs/task_a/phase3_r1
            outputs/task_a/phase3_r1-execution.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce scientific gate
        if: always()
        run: |
          test "${{ steps.experiment.outputs.exit_code }}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("reports/task_a_phase3_r1_results.json").read_text())
          if not result["gate"]["passed"]:
              raise SystemExit(
                  "D4A failed: " + ", ".join(result["gate"]["reason_codes"])
              )
          print("D4A_A3_R1_STRUCTURED_EVIDENCE_UTILITY: PASS")
          PY
