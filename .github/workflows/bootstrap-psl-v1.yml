name: Bootstrap Task A Phase 4 PSL v1

on:
  push:
    branches:
      - research/task-a-phase4-psl-v1
    paths:
      - ".github/workflows/bootstrap-psl-v1.yml"
      - ".bootstrap/psl_v1_payload.part-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/task-a-phase4-psl-v1

      - name: Reassemble, decode and verify implementation payload
        run: |
          cat \
            .bootstrap/psl_v1_payload.part-00 \
            .bootstrap/psl_v1_payload.part-01 \
            .bootstrap/psl_v1_payload.part-02 \
            .bootstrap/psl_v1_payload.part-03a \
            .bootstrap/psl_v1_payload.part-03b \
            .bootstrap/psl_v1_payload.part-04 \
            > /tmp/psl-v1.b64
          echo "64181affd007d1198ab4f126924aa8aff4328d6e9a65e10d1d60fd1296d72441  /tmp/psl-v1.b64" | sha256sum --check
          base64 --decode /tmp/psl-v1.b64 > /tmp/psl-v1.tar.gz
          echo "c73038b5e259e24b18af1888556f8d15012ab5f17872fb2304edf97419f231a7  /tmp/psl-v1.tar.gz" | sha256sum --check
          tar -xzf /tmp/psl-v1.tar.gz -C .

      - name: Isolate the new ternary PSL target predicate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/logagent_benchmark/psl_multi_evidence.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "Calls(C, S, O)": "RecoveredCallsV1(C, S, O)",
              'Predicate("Calls", size=3)': 'Predicate("RecoveredCallsV1", size=3)',
              'if str(atom.get("predicate", "")).upper() == "CALLS"':
                  'if str(atom.get("predicate", "")).upper() == "RECOVEREDCALLSV1"',
              "PSL did not return Calls targets":
                  "PSL did not return RecoveredCallsV1 targets",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected PSL source fragment not found: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          if "Calls(C, S, O)" in text or 'Predicate("Calls", size=3)' in text:
              raise SystemExit("legacy ternary Calls predicate remains")
          print("PSL_TARGET_PREDICATE=RecoveredCallsV1")
          PY
          python -m py_compile \
            src/logagent_benchmark/psl_multi_evidence.py \
            src/logagent_benchmark/task_a_phase4_psl.py \
            tools/run_task_a_phase4_psl.py \
            tests/test_task_a_phase4_psl.py

      - name: Commit materialized PSL v1 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            configs/experiment_task_a_rcaeval_phase4_psl_v1.json \
            docs/task_a_phase4_psl_v1.md \
            reports/task_a_phase4_psl_status.md \
            src/logagent_benchmark/psl_multi_evidence.py \
            src/logagent_benchmark/task_a_phase4_psl.py \
            tests/test_task_a_phase4_psl.py \
            tools/run_task_a_phase4_psl.py
          if git diff --cached --quiet; then
            echo "PSL v1 implementation is already materialized"
          else
            git commit -m "fix: isolate ternary PSL target predicate"
            git push origin HEAD:research/task-a-phase4-psl-v1
          fi
