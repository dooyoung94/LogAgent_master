name: Publish Task A Phase 4 PSL v1 Results

on:
  push:
    branches:
      - research/task-a-phase4-psl-v1
    paths:
      - ".github/workflows/publish-task-a-phase4-psl-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PSL v1 branch
        uses: actions/checkout@v4
        with:
          ref: research/task-a-phase4-psl-v1

      - name: Download and verify canonical workflow artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9879120002"
          ARTIFACT_SHA256: "bc8b00dc16a606679ef35ff80f41e3cbdd89abf4595f4c2d6e7df58e7a9e83ce"
        run: |
          mkdir -p /tmp/psl-v1-artifact
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/task-a-phase4-psl-v1.zip
          echo "${ARTIFACT_SHA256}  /tmp/task-a-phase4-psl-v1.zip" | sha256sum --check
          unzip -q /tmp/task-a-phase4-psl-v1.zip -d /tmp/psl-v1-artifact
          test -f /tmp/psl-v1-artifact/phase4_psl_v1/published/task_a_phase4_psl_results.json

      - name: Publish immutable PASS or FAIL results
        run: |
          mkdir -p reports
          cp /tmp/psl-v1-artifact/phase4_psl_v1/published/task_a_phase4_psl_results.json reports/task_a_phase4_psl_results.json
          cp /tmp/psl-v1-artifact/phase4_psl_v1/published/task_a_phase4_psl_results.md reports/task_a_phase4_psl_results.md
          cp /tmp/psl-v1-artifact/phase4_psl_v1/published/task_a_phase4_psl_calibration_cells.csv reports/task_a_phase4_psl_calibration_cells.csv
          cp /tmp/psl-v1-artifact/phase4_psl_v1/published/task_a_phase4_psl_heldout_cells.csv reports/task_a_phase4_psl_heldout_cells.csv
          cp /tmp/psl-v1-artifact/phase4_psl_v1/published/task_a_phase4_psl_policy_grid.csv reports/task_a_phase4_psl_policy_grid.csv
          cp /tmp/psl-v1-artifact/phase4_psl_v1/published/task_a_phase4_psl_ablation_results.csv reports/task_a_phase4_psl_ablation_results.csv
          cp /tmp/psl-v1-artifact/phase4_psl_v1/published/task_a_phase4_psl_manifest.json reports/task_a_phase4_psl_manifest.json
          cp /tmp/psl-v1-artifact/phase4_psl_v1/published/task_a_phase4_psl_status.txt reports/task_a_phase4_psl_status.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          reports = sorted(Path("reports").glob("task_a_phase4_psl_*"))
          receipt = {
              "schema_version": 1,
              "experiment": "task-a-phase4-psl-v1",
              "workflow_run_id": 33717711153,
              "workflow_head_sha": "f363ef3eb2260a9e370497ffb4269b4dbd278378",
              "artifact_id": 9879120002,
              "artifact_sha256": "bc8b00dc16a606679ef35ff80f41e3cbdd89abf4595f4c2d6e7df58e7a9e83ce",
              "result_files": {
                  path.name: {
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in reports
              },
          }
          Path("reports/task_a_phase4_psl_execution_receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit canonical results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/task_a_phase4_psl_*
          if git diff --cached --quiet; then
            echo "PSL v1 reports already match canonical artifact"
          else
            status=$(tr -d '\r\n' < reports/task_a_phase4_psl_status.txt)
            git commit -m "results: publish Task A Phase 4 PSL v1 ${status}"
            git push origin HEAD:research/task-a-phase4-psl-v1
          fi
